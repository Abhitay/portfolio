<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .box    { fill:#ffffff; stroke:#e7e3dd; stroke-width:1.5; }
    .fill   { fill:#f6f4f1; stroke:#e7e3dd; stroke-width:1.5; }
    .strong { fill:#f6f4f1; stroke:#d3cec6; stroke-width:3; }
    .dia    { fill:#ffffff; stroke:#e7e3dd; stroke-width:1.5; }
    .lbl    { fill:#0a0a0a; font-size:23px; }
    .sm     { fill:#0a0a0a; font-size:21px; }
    .mut    { fill:#6f6b66; font-size:18px; }
    .edge   { stroke:#0a0a0a; stroke-width:1.6; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7.5,3 L0,6 Z" fill="#0a0a0a"/>
    </marker>
  </defs>
  <rect width="1320" height="900" fill="#ffffff"/>

  <!-- nodes -->
  <rect class="fill" x="490" y="40" width="220" height="64" rx="8"/>
  <text class="lbl" x="600" y="80" text-anchor="middle">Ask model</text>

  <polygon class="dia" points="600,120 730,190 600,260 470,190"/>
  <text class="sm" x="600" y="184" text-anchor="middle">Tool</text>
  <text class="sm" x="600" y="207" text-anchor="middle">requested?</text>

  <rect class="box" x="1000" y="158" width="200" height="64" rx="8"/>
  <text class="lbl" x="1100" y="198" text-anchor="middle">Finish</text>

  <polygon class="dia" points="600,300 720,360 600,420 480,360"/>
  <text class="sm" x="600" y="354" text-anchor="middle">Validate</text>
  <text class="sm" x="600" y="377" text-anchor="middle">schema</text>

  <rect class="box" x="140" y="330" width="300" height="60" rx="8"/>
  <text class="sm" x="290" y="354" text-anchor="middle">Return error</text>
  <text class="mut" x="290" y="378" text-anchor="middle">as observation</text>

  <polygon class="dia" points="600,460 725,520 600,580 475,520"/>
  <text class="sm" x="600" y="514" text-anchor="middle">high_risk</text>
  <text class="sm" x="600" y="537" text-anchor="middle">tool?</text>

  <rect class="box" x="1000" y="488" width="180" height="64" rx="8"/>
  <text class="lbl" x="1090" y="528" text-anchor="middle">Execute</text>

  <rect class="box" x="1000" y="620" width="180" height="64" rx="8"/>
  <text class="lbl" x="1090" y="660" text-anchor="middle">Observation</text>

  <rect class="strong" x="470" y="650" width="260" height="80" rx="8"/>
  <text class="sm" x="600" y="686" text-anchor="middle">HUMAN APPROVAL</text>
  <text class="sm" x="600" y="712" text-anchor="middle">REQUIRED</text>

  <rect class="box" x="140" y="660" width="280" height="60" rx="8"/>
  <text class="sm" x="280" y="696" text-anchor="middle">Record refusal</text>

  <!-- edges -->
  <path class="edge" d="M600 104 L600 118" marker-end="url(#a)"/>
  <path class="edge" d="M730 190 L998 190" marker-end="url(#a)"/>
  <text class="mut" x="858" y="178" text-anchor="middle">no</text>
  <path class="edge" d="M600 260 L600 298" marker-end="url(#a)"/>
  <text class="mut" x="624" y="284">yes</text>
  <path class="edge" d="M480 360 L442 360" marker-end="url(#a)"/>
  <text class="mut" x="455" y="342" text-anchor="middle">invalid</text>
  <path class="edge" d="M600 420 L600 458" marker-end="url(#a)"/>
  <text class="mut" x="624" y="444">valid</text>
  <path class="edge" d="M725 520 L998 520" marker-end="url(#a)"/>
  <text class="mut" x="858" y="508" text-anchor="middle">no</text>
  <path class="edge" d="M1090 552 L1090 618" marker-end="url(#a)"/>
  <path class="edge" d="M600 580 L600 648" marker-end="url(#a)"/>
  <text class="mut" x="624" y="616">yes</text>
  <path class="edge" d="M730 680 L998 545" marker-end="url(#a)"/>
  <text class="mut" x="880" y="600" text-anchor="middle">approved</text>
  <path class="edge" d="M470 690 L422 690" marker-end="url(#a)"/>
  <text class="mut" x="445" y="672" text-anchor="middle">refused</text>

  <!-- return bus -->
  <path class="edge" d="M1000 652 L120 652 L120 72 L486 72" marker-end="url(#a)"/>
  <path class="edge" d="M140 360 L120 360"/>
  <path class="edge" d="M140 690 L120 690"/>
  <text class="mut" x="300" y="60" text-anchor="middle">next turn</text>
  <text class="mut" x="255" y="415" text-anchor="middle">agent self-corrects</text>

  <!-- footer -->
  <line x1="120" y1="820" x2="1200" y2="820" stroke="#e7e3dd" stroke-width="1.5"/>
  <text class="mut" x="660" y="858" text-anchor="middle">every node writes an ordered trace:  run_id + step</text>
</svg>
